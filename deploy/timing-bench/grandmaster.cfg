# The emulated GNSS grandmaster of the timing bench (ICS-019): ptp4l with
# software time stamps, serving time only and announcing four times a second.
# run-bench.sh sets its clock quality with pmc to emulate GNSS lock and loss.
# Its clock is the host's, already UTC, so it announces a UTC offset of 0.
[global]
serverOnly 1
clockClass 6
clockAccuracy 0x21
timeSource 0x20
utc_offset 0
logAnnounceInterval -2
logSyncInterval -3
time_stamping software
network_transport L2
