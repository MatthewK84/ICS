name: C++ toolchain

# Builds the ics-cpp image and proves the toolchain is reproducible (ICS-004):
# the toolchain_check sample must build byte-identically in two build folders
# with GCC 13 and with Clang 17. Then the test stages (ICS-008): the ICS code
# must pass under ASan, UBSan and TSan with both compilers and survive a minute
# of fuzzing per target, and the C++ Power-of-Ten profile (ICS-005) must hold:
# no suppressions, clean -Werror builds, clang-tidy and cppcheck. Each stage
# must also reject its seeded defect. Images are published to GHCR from main,
# signed by digest with cosign, with a CycloneDX SBOM and SLSA provenance
# attached (ICS-009, deploy/evidence/README.md). The image's GeographicLib must
# also reproduce the golden frame vectors in golden/frames (ICS-014). The code
# listed in cpp/policy/coverage-gates.txt must keep full line and branch
# coverage and its assertion-density floor (ICS-015).
#
# The stages run side by side, one job each, so a change with the Conan cache
# warm finishes in under ten minutes. "deps" makes sure the cache holds every
# preset's dependencies; "image-checks" checks the image itself; each "checks"
# job builds the image and runs one stage; and "publish" builds, signs and
# pushes the image from main once every stage has passed. The image is built
# from an Ubuntu snapshot and pinned packages, so every job's copy has the
# same contents.

on:
  pull_request:
    paths:
      - cpp/**
      - golden/proto/**
      - golden/frames/**
      - deploy/toolchain/**
      - deploy/evidence/**
      - .github/scripts/evidence.py
      - .github/scripts/cpp_coverage.py
      - .github/workflows/cpp-toolchain.yml
  push:
    branches: [main]
    paths:
      - cpp/**
      - golden/proto/**
      - golden/frames/**
      - deploy/toolchain/**
      - deploy/evidence/**
      - .github/scripts/evidence.py
      - .github/scripts/cpp_coverage.py
      - .github/workflows/cpp-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

# A run on main is never cancelled, so every image it publishes gets signed.
concurrency:
  group: cpp-toolchain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/matthewk84/ics-cpp
  # Conan's package cache lives on the runner at /tmp/conan-home, so it can be
  # cached between runs: protobuf and abseil build from source for each
  # compiler, build type and sanitizer (ICS-011).
  RUN: docker run --rm -v ${{ github.workspace }}:/work/ics -w /work/ics -v /tmp/conan-home:/opt/conan-home ics-cpp:ci

jobs:
  # The Conan package cache, keyed by everything that decides its contents.
  # When it holds this key, the job only looks it up; when it does not, it
  # builds what is missing from the nearest older cache and saves the result,
  # so the checks never race to save part of it. A run that must build every
  # dependency from source takes about 90 minutes.
  deps:
    name: Conan package cache
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Name the Conan package cache
        id: key
        env:
          INPUTS: ${{ hashFiles('cpp/conan.lock', 'cpp/conan/profiles/*', 'deploy/toolchain/Dockerfile.cpp', 'deploy/toolchain/apt-packages.txt', 'deploy/toolchain/requirements-conan.txt') }}
        run: echo "key=conan-cpp-toolchain-${INPUTS}" >> "${GITHUB_OUTPUT}"

      - name: Look up the Conan package cache
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/conan-home
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # Before any docker run: Docker creates a missing bind-mount source as
      # root, and actions/cache, which runs as the runner user, then cannot
      # extract into it. It only warns, so every dependency was rebuilt.
      - name: Create the Conan cache folder
        if: steps.lookup.outputs.cache-hit != 'true'
        run: mkdir -p /tmp/conan-home

      - name: Build the ics-cpp image
        if: steps.lookup.outputs.cache-hit != 'true'
        run: docker build -f deploy/toolchain/Dockerfile.cpp -t ics-cpp:ci .

      - name: Restore the nearest Conan package cache
        id: conan-cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/conan-home
          key: ${{ steps.key.outputs.key }}
          restore-keys: conan-cpp-toolchain-

      # A cache that matched but did not arrive fails here, rather than as a
      # silent rebuild of every dependency.
      - name: Check the restored Conan cache
        if: steps.lookup.outputs.cache-hit != 'true' && steps.conan-cache.outputs.cache-matched-key != ''
        env:
          MATCHED_KEY: ${{ steps.conan-cache.outputs.cache-matched-key }}
        run: |
          if [ -z "$(ls -A /tmp/conan-home/p 2>/dev/null)" ]; then
            echo "::error::Conan cache ${MATCHED_KEY} matched, but nothing was restored into /tmp/conan-home"
            exit 1
          fi
          echo "Restored ${MATCHED_KEY}: $(du -sh /tmp/conan-home | cut -f1)"

      # Every Conan binary the checks need: plain, and with ASan and TSan for
      # the sanitizer and fuzz presets.
      - name: Install the Conan dependencies of every preset
        if: steps.lookup.outputs.cache-hit != 'true'
        run: >-
          ${RUN} deploy/toolchain/conan-install.sh gcc-release clang-release
          gcc-debug clang-debug gcc-asan clang-asan gcc-tsan clang-tsan

      - name: Trim the Conan package cache before it is saved
        if: steps.lookup.outputs.cache-hit != 'true'
        run: ${RUN} conan cache clean "*" --source --build --download --temp

      - name: Save the Conan package cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/conan-home
          key: ${{ steps.key.outputs.key }}

  # The image's own checks. It does not wait for deps, so a stale lockfile
  # prints the lockfile to commit even when deps cannot install it.
  image-checks:
    name: ics-cpp image, golden vectors, lockfile and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create the Conan cache folder
        run: mkdir -p /tmp/conan-home

      - name: Build the ics-cpp image
        run: docker build -f deploy/toolchain/Dockerfile.cpp -t ics-cpp:ci .

      - name: Restore the nearest Conan package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/conan-home
          key: conan-cpp-toolchain-${{ hashFiles('cpp/conan.lock', 'cpp/conan/profiles/*', 'deploy/toolchain/Dockerfile.cpp', 'deploy/toolchain/apt-packages.txt', 'deploy/toolchain/requirements-conan.txt') }}
          restore-keys: conan-cpp-toolchain-

      # GeographicLib in the image must reproduce golden/frames exactly (ICS-014).
      - name: Golden frame vectors are current
        run: ${RUN} golden/frames/generate.sh --check

      # When the lockfile is missing, or cpp/conanfile.py requires a package it
      # does not pin, print the lockfile to commit. An existing lockfile keeps
      # every pin; only the new packages are resolved (--lockfile-partial).
      # The check uses conan graph info, which holds to the lockfile strictly;
      # conan lock create always treats it as partial, so it never fails here.
      - name: Require a current Conan lockfile
        run: |
          profile=(--profile:all cpp/conan/profiles/gcc13)
          lock=(conan lock create cpp "${profile[@]}" --lockfile-out /tmp/conan.lock)
          if [ ! -f cpp/conan.lock ]; then
            ${RUN} bash -c "${lock[*]} >/dev/null && base64 -w0 /tmp/conan.lock"
            echo
            echo "::error::cpp/conan.lock is missing. Decode the base64 line above into cpp/conan.lock and commit it."
            exit 1
          fi
          if ${RUN} conan graph info cpp "${profile[@]}" --lockfile cpp/conan.lock >"${RUNNER_TEMP}/lock-check.log" 2>&1; then
            exit 0
          fi
          tail -n 20 "${RUNNER_TEMP}/lock-check.log"
          ${RUN} bash -c "${lock[*]} --lockfile cpp/conan.lock --lockfile-partial >/dev/null && base64 -w0 /tmp/conan.lock"
          echo
          echo "::error::cpp/conan.lock does not pin every package cpp/conanfile.py requires. Decode the base64 line above into cpp/conan.lock and commit it; the packages already pinned keep their versions."
          exit 1

      - name: Install Syft and cosign
        run: |
          deploy/evidence/install-tools.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: SBOM of the image
        run: deploy/evidence/image-sbom.sh ics-cpp:ci "${IMAGE}" "${RUNNER_TEMP}/ics-cpp.cdx.json"

  # One stage per job, each in its own copy of the image, with the Conan
  # packages deps saved.
  checks:
    name: ${{ matrix.name }}
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Reproducible build with GCC 13
            check: deploy/toolchain/check-reproducible.sh gcc
          - name: Reproducible build with Clang 17
            check: deploy/toolchain/check-reproducible.sh clang
          - name: AddressSanitizer with GCC 13
            check: cpp/policy/check-dynamic.sh sanitizers gcc-asan
          - name: UndefinedBehaviorSanitizer with GCC 13
            check: cpp/policy/check-dynamic.sh sanitizers gcc-ubsan
          - name: ThreadSanitizer with GCC 13
            check: cpp/policy/check-dynamic.sh sanitizers gcc-tsan
          - name: AddressSanitizer with Clang 17
            check: cpp/policy/check-dynamic.sh sanitizers clang-asan
          - name: UndefinedBehaviorSanitizer with Clang 17
            check: cpp/policy/check-dynamic.sh sanitizers clang-ubsan
          - name: ThreadSanitizer with Clang 17
            check: cpp/policy/check-dynamic.sh sanitizers clang-tsan
          - name: Fuzzing (one minute per target)
            check: cpp/policy/check-dynamic.sh fuzz 60
          - name: Coverage and assertion density
            check: cpp/policy/check-dynamic.sh coverage
          - name: Power-of-Ten policy with GCC 13 (warnings)
            check: cpp/policy/check-policy.sh gcc
          - name: Power-of-Ten policy with Clang 17 (warnings, clang-tidy, cppcheck)
            check: cpp/policy/check-policy.sh clang
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create the Conan cache folder
        run: mkdir -p /tmp/conan-home

      - name: Build the ics-cpp image
        run: docker build -f deploy/toolchain/Dockerfile.cpp -t ics-cpp:ci .

      - name: Restore the Conan package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/conan-home
          key: ${{ needs.deps.outputs.key }}
          fail-on-cache-miss: true

      - name: ${{ matrix.name }}
        env:
          CHECK: ${{ matrix.check }}
        run: |
          read -ra check <<<"${CHECK}"
          ${RUN} "${check[@]}"

  # Only from main, and only once every check has passed.
  publish:
    name: Publish and sign the ics-cpp image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [image-checks, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build the ics-cpp image
        run: docker build -f deploy/toolchain/Dockerfile.cpp -t ics-cpp:ci .

      - name: Install Syft and cosign
        run: |
          deploy/evidence/install-tools.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: SBOM of the image
        run: deploy/evidence/image-sbom.sh ics-cpp:ci "${IMAGE}" "${RUNNER_TEMP}/ics-cpp.cdx.json"

      - name: Publish the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
          docker tag ics-cpp:ci "${IMAGE}:${GITHUB_SHA}"
          docker tag ics-cpp:ci "${IMAGE}:main"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:main"

      - name: Sign the image and attach its SBOM and provenance
        run: deploy/evidence/attest-image.sh "${IMAGE}" "${GITHUB_SHA}" "${RUNNER_TEMP}/ics-cpp.cdx.json"
