name: C++ toolchain

# The C++ checks (ICS-004, ICS-005, ICS-008, ICS-014, ICS-015), each in the
# versioned build image of its dependency configuration (#159):
#
# - the toolchain_check sample and the ICS code build byte-identically twice
#   with GCC 13, which also holds every GCC build to -Werror;
# - the ICS code passes its tests under Clang's ASan, UBSan and TSan;
# - the code listed in cpp/policy/coverage-gates.txt keeps full line and
#   branch coverage and its assertion-density floor;
# - the Power-of-Ten profile holds: no suppressions, a clean -Werror Clang
#   build and clang-tidy;
# - the image's GeographicLib reproduces the golden frame vectors.
#
# Each stage must also reject its seeded defect. "images" builds the images
# the checks run in, only those GHCR does not have for their key
# (.github/workflows/conan-deps.yml); each check then pulls its image
# (.github/actions/build-image) and downloads nothing else. Every image is
# signed, with its SBOM and provenance, when it is built (ICS-009,
# deploy/evidence/README.md).

on:
  pull_request:
    paths:
      - cpp/**
      - golden/proto/**
      - golden/frames/**
      - deploy/toolchain/**
      - deploy/evidence/**
      - .github/scripts/evidence.py
      - .github/scripts/cpp_coverage.py
      - .github/scripts/clang_tidy_cache.py
      - .github/ccache.conf
      - .github/workflows/cpp-toolchain.yml
      - .github/workflows/conan-deps.yml
      - .github/actions/build-image/**
      - .github/actions/toolchain-image/**
      - .github/actions/conan-deps/**
  push:
    branches: [main]
    paths:
      - cpp/**
      - golden/proto/**
      - golden/frames/**
      - deploy/toolchain/**
      - deploy/evidence/**
      - .github/scripts/evidence.py
      - .github/scripts/cpp_coverage.py
      - .github/scripts/clang_tidy_cache.py
      - .github/ccache.conf
      - .github/workflows/cpp-toolchain.yml
      - .github/workflows/conan-deps.yml
      - .github/actions/build-image/**
      - .github/actions/toolchain-image/**
      - .github/actions/conan-deps/**
  workflow_dispatch:

permissions:
  contents: read

# A run on main is never cancelled, so every image it publishes gets signed.
concurrency:
  group: cpp-toolchain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The build images of the configurations the checks use, as conan-install.sh
  # names its output folders: a compiler, a build type and, for ASan and TSan,
  # a sanitizer. The other C++ workflows use gcc13-Release.
  images:
    name: Images
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/conan-deps.yml
    with:
      configs: '["gcc13-Release", "clang17-Debug", "clang17-Debug-asan", "clang17-Debug-tsan"]'

  # GeographicLib in the image must reproduce golden/frames exactly (ICS-014).
  image-checks:
    name: Golden frame vectors
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Pull the gcc13-Release build image
        uses: ./.github/actions/build-image
        with:
          config: gcc13-Release

      - name: Golden frame vectors are current
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/work/ics" -w /work/ics ics-build:ci golden/frames/generate.sh --check

  # One stage per job, each in the build image of its configuration: UBSan,
  # coverage and the policy check use the plain Clang Debug dependencies.
  checks:
    name: ${{ matrix.name }}
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    # Each check but the reproducible builds keeps its compiles (ccache, with
    # .github/ccache.conf) and the files clang-tidy passed
    # (.github/scripts/clang_tidy_cache.py, mounted over clang-tidy-17) in
    # /tmp/ci-cache, so a change recompiles and re-checks only what it
    # affects. The reproducible builds must compile everything, or their
    # second build would come from the cache. Only main saves the caches;
    # a pull request starts from main's. A missing cache only costs time.
    env:
      CACHED: ${{ !startsWith(matrix.name, 'Reproducible') }}
      CMAKE_C_COMPILER_LAUNCHER: ${{ !startsWith(matrix.name, 'Reproducible') && 'ccache' || '' }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ !startsWith(matrix.name, 'Reproducible') && 'ccache' || '' }}
      RUN: >-
        docker run --rm -v ${{ github.workspace }}:/work/ics -w /work/ics
        -v /tmp/ci-cache:/opt/ci-cache -e CCACHE_DIR=/opt/ci-cache/ccache
        -e CCACHE_CONFIGPATH=/work/ics/.github/ccache.conf -e CMAKE_C_COMPILER_LAUNCHER -e CMAKE_CXX_COMPILER_LAUNCHER
        -e TIDY_CACHE_DIR=/opt/ci-cache/tidy
        -v ${{ github.workspace }}/.github/scripts/clang_tidy_cache.py:/usr/local/bin/clang-tidy-17:ro ics-build:ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Reproducible build with GCC 13
            conan: gcc13-Release
            check: deploy/toolchain/check-reproducible.sh gcc
          - name: AddressSanitizer with Clang 17
            conan: clang17-Debug-asan
            check: cpp/policy/check-dynamic.sh sanitizers clang-asan
          - name: UndefinedBehaviorSanitizer with Clang 17
            conan: clang17-Debug
            check: cpp/policy/check-dynamic.sh sanitizers clang-ubsan
          - name: ThreadSanitizer with Clang 17
            conan: clang17-Debug-tsan
            check: cpp/policy/check-dynamic.sh sanitizers clang-tsan
          - name: Coverage and assertion density
            conan: clang17-Debug
            check: cpp/policy/check-dynamic.sh coverage
          - name: Power-of-Ten policy with Clang 17 (warnings, clang-tidy)
            conan: clang17-Debug
            check: cpp/policy/check-policy.sh clang
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Before any docker run, so the runner owns the folder; Docker would
      # create it for root.
      - name: Create the cache folder
        run: mkdir -p /tmp/ci-cache

      - name: Restore the compile and clang-tidy caches
        if: env.CACHED == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ci-cache
          key: ci-cache|${{ matrix.check }}|${{ github.sha }}
          restore-keys: ci-cache|${{ matrix.check }}|

      - name: Pull the ${{ matrix.conan }} build image
        uses: ./.github/actions/build-image
        with:
          config: ${{ matrix.conan }}

      - name: ${{ matrix.name }}
        env:
          CHECK: ${{ matrix.check }}
        run: |
          read -ra check <<<"${CHECK}"
          ${RUN} "${check[@]}"

      - name: Compile cache statistics
        if: ${{ !cancelled() && env.CACHED == 'true' }}
        run: ${RUN} ccache --show-stats

      - name: Save the compile and clang-tidy caches
        if: ${{ !cancelled() && env.CACHED == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ci-cache
          key: ci-cache|${{ matrix.check }}|${{ github.sha }}

