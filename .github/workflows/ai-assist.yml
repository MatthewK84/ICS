name: AI assist

# Required status check for AI-assisted changes (ICS-003, docs/ai-usage.md).
# "AI-assist declaration" fails until the pull request answers the AI
# assistance question, and keeps the ai-assisted label in step. The
# pull-request text is read from the event file, never from a shell
# expression, and pull_request (not pull_request_target) keeps fork runs
# read-only.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-assist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  declaration:
    name: AI-assist declaration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test the scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check the declaration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ai_assist.py declaration

