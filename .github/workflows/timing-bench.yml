name: Timing bench

# Runs the emulated timing bench (ICS-019, deploy/timing-bench/README.md):
# ics-timingd, built with GCC 13 in the gcc13-Release build image, polls a software ptp4l station that follows a software ptp4l
# grandmaster in another network namespace. Each of 20 trials emulates GNSS
# loss at the grandmaster, and fails the run unless ics-timingd flags holdover
# within 1 s. It runs on pull requests that change the timing code or the
# bench, and by hand. The trial latencies and the logs of ptp4l and ics-timingd are kept as
# the timing-bench-<run id> artifact for 30 days.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - cpp/timing/**
      - cpp/services/timingd/**
      - deploy/timing-bench/**
      - .github/workflows/timing-bench.yml
      - .github/actions/build-image/**

permissions:
  contents: read
  packages: read

concurrency:
  group: timing-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUN: docker run --rm -v ${{ github.workspace }}:/work/ics -w /work/ics ics-build:ci
  RECORDS: /tmp/timing-bench

jobs:
  bench:
    name: Flag holdover within 1 s of GNSS loss
    runs-on: ubuntu-24.04
    # Building takes about 10 minutes; the bench takes 1.
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Built by the C++ toolchain workflow, which this waits for when the
      # image's inputs change (#159).
      - name: Pull the gcc13-Release build image
        uses: ./.github/actions/build-image
        with:
          config: gcc13-Release
          wait-minutes: '60'

      - name: Build ics-timingd and ics-time-watch
        run: >-
          ${RUN} bash -c 'deploy/toolchain/conan-install.sh gcc-release
          && cd cpp && cmake --preset gcc-release >/dev/null
          && cmake --build build/gcc-release --target ics-timingd ics-time-watch'

      - name: Install the bench's host tools
        run: |
          mapfile -t packages < <(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' deploy/timing-bench/apt-packages.txt)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"

      - name: Run the bench
        run: >-
          sudo env BENCH_OUT="${RECORDS}" deploy/timing-bench/run-bench.sh
          cpp/build/gcc-release/services/timingd/ics-timingd 20

      - name: Keep the bench records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timing-bench-${{ github.run_id }}
          path: ${{ env.RECORDS }}/
          if-no-files-found: warn
          retention-days: 30
