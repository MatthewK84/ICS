name: Timing bench

# Runs the emulated timing bench every night (ICS-019,
# deploy/timing-bench/README.md): ics-timingd, built with GCC 13 in the
# ics-cpp image, polls a software ptp4l station that follows a software ptp4l
# grandmaster in another network namespace. Each of 20 trials emulates GNSS
# loss at the grandmaster, and fails the run unless ics-timingd flags holdover
# within 1 s. It also runs on pull requests that change the timing code or the
# bench. The trial latencies and the logs of ptp4l and ics-timingd are kept as
# the timing-bench-<run id> artifact for 30 days.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - cpp/timing/**
      - cpp/services/timingd/**
      - deploy/timing-bench/**
      - .github/workflows/timing-bench.yml

permissions:
  contents: read

concurrency:
  group: timing-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Conan package cache the C++ toolchain workflow saves, as it mounts it.
  RUN: docker run --rm -v ${{ github.workspace }}:/work/ics -w /work/ics -v /tmp/conan-home:/opt/conan-home ics-cpp:ci
  RECORDS: /tmp/timing-bench

jobs:
  bench:
    name: Flag holdover within 1 s of GNSS loss
    runs-on: ubuntu-24.04
    # With the Conan cache, building takes about 10 minutes; without it,
    # protobuf and abseil build from source, about 40. The bench takes 1.
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Before any docker run, so the runner user owns it (see cpp-toolchain.yml).
      - name: Create the Conan cache folder
        run: mkdir -p /tmp/conan-home

      - name: Build the ics-cpp image
        run: docker build -f deploy/toolchain/Dockerfile.cpp -t ics-cpp:ci .

      # Restored only: the C++ toolchain workflow owns the cache and saves it.
      - name: Restore the Conan package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/conan-home
          key: conan-cpp-toolchain-${{ hashFiles('cpp/conan.lock', 'cpp/conan/profiles/*', 'deploy/toolchain/Dockerfile.cpp', 'deploy/toolchain/apt-packages.txt', 'deploy/toolchain/requirements-conan.txt') }}
          restore-keys: conan-cpp-toolchain-

      - name: Build ics-timingd
        run: >-
          ${RUN} bash -c 'deploy/toolchain/conan-install.sh gcc-release
          && cd cpp && cmake --preset gcc-release >/dev/null
          && cmake --build build/gcc-release --target ics-timingd'

      - name: Install the bench's host tools
        run: |
          mapfile -t packages < <(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' deploy/timing-bench/apt-packages.txt)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"

      - name: Run the bench
        run: >-
          sudo env BENCH_OUT="${RECORDS}" deploy/timing-bench/run-bench.sh
          cpp/build/gcc-release/services/timingd/ics-timingd 20

      - name: Keep the bench records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timing-bench-${{ github.run_id }}
          path: ${{ env.RECORDS }}/
          if-no-files-found: warn
          retention-days: 30
