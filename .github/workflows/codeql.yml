name: CodeQL

# Static security and quality analysis of the C++, Python and TypeScript code
# with CodeQL's security-and-quality queries (ICS-008). Findings go to the
# repository's Security tab, and the job fails on any finding. The seeded job
# analyzes the defects in .github/codeql/seeded without uploading them and
# requires each language's expected query to fire, so an analysis that silently
# stops finding things fails too. The weekly run picks up new queries.

on:
  pull_request:
    paths:
      - cpp/**
      - python/**
      - web/**
      - .github/scripts/**
      - .github/codeql/**
      - .github/workflows/codeql.yml
  push:
    branches: [main]
    paths:
      - cpp/**
      - python/**
      - web/**
      - .github/scripts/**
      - .github/codeql/**
      - .github/workflows/codeql.yml
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python, javascript-typescript]
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/sarif

      - name: Fail on any finding
        run: python3 .github/scripts/sarif_check.py "${RUNNER_TEMP}/sarif"

  seeded:
    name: CodeQL seeded defect (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            expect: cpp/wrong-type-format-argument
          - language: python
            expect: py/incomplete-url-substring-sanitization
          - language: javascript-typescript
            expect: js/incomplete-sanitization
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/codeql-seeded.yml

      - name: Analyze without uploading
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /seeded/language:${{ matrix.language }}
          output: ${{ runner.temp }}/sarif
          upload: never

      - name: Require the seeded defect
        env:
          EXPECTED_RULE: ${{ matrix.expect }}
        run: python3 .github/scripts/sarif_check.py "${RUNNER_TEMP}/sarif" --expect "${EXPECTED_RULE}"
