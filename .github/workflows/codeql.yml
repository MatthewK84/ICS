name: CodeQL

# Static security and quality analysis of the C++, Python and TypeScript code
# with CodeQL's security-and-quality queries (ICS-008). Findings go to the
# repository's Security tab, and the job fails on any finding. The seeded jobs
# analyze the defects in .github/codeql/seeded without uploading their results
# or databases and require each language's expected query to fire, so an
# analysis that silently stops finding things fails too. The weekly run picks
# up new queries.
#
# Python and TypeScript are analyzed without a build. C++ is analyzed from a
# traced build inside the published ics-cpp image, so CodeQL sees the real
# compiler flags and headers (C++20, GoogleTest from Conan); guessing them
# misreads the code.

on:
  pull_request:
    paths:
      - cpp/**
      - python/**
      - web/**
      - .github/scripts/**
      - .github/codeql/**
      - .github/workflows/codeql.yml
      - .github/actions/conan-deps/**
      - deploy/toolchain/conan-*.sh
      - deploy/evidence/dependency-artifact.sh
      - deploy/evidence/install-tools.sh
      - deploy/evidence/tools.txt
  push:
    branches: [main]
    paths:
      - cpp/**
      - python/**
      - web/**
      - .github/scripts/**
      - .github/codeql/**
      - .github/workflows/codeql.yml
      - .github/actions/conan-deps/**
      - deploy/toolchain/conan-*.sh
      - deploy/evidence/dependency-artifact.sh
      - deploy/evidence/install-tools.sh
      - deploy/evidence/tools.txt
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/sarif

      - name: Fail on any finding
        run: python3 .github/scripts/sarif_check.py "${RUNNER_TEMP}/sarif"

  analyze-cpp:
    name: CodeQL (c-cpp)
    runs-on: ubuntu-24.04
    # About 15 minutes with the dependency packages built. When a lockfile
    # change has not been through the dependency workflow yet, it also builds
    # the new dependencies from source first; gRPC alone (#146) takes up to 45
    # minutes.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      security-events: write
    container:
      image: ghcr.io/matthewk84/ics-cpp:main
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The job runs in the image, so the packages restore straight into its
      # Conan home.
      - name: Restore the gcc13-Debug Conan packages
        uses: ./.github/actions/conan-deps
        with:
          config: gcc13-Debug

      # Before CodeQL starts tracing, so dependencies Conan builds from source
      # (protobuf, abseil) are not analyzed as ICS code.
      - name: Install the Conan dependencies
        run: deploy/toolchain/conan-install.sh gcc-debug

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: c-cpp
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml

      - name: Build (traced by CodeQL)
        run: |
          cd cpp
          cmake --preset gcc-debug
          cmake --build --preset gcc-debug

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:c-cpp
          output: ${{ runner.temp }}/sarif
          upload: never

      # paths-ignore does not filter C++ results, so the results in code that is
      # not ICS-authored are dropped before the rest are checked and uploaded:
      # the protobuf code generated into cpp/proto/gen (ICS-011), and the gRPC
      # code generated at build time into the build folder (#146).
      - name: Fail on any finding in ICS code
        run: python3 .github/scripts/sarif_check.py "${RUNNER_TEMP}/sarif" --drop cpp/proto/gen/ cpp/build/

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sarif
          category: /language:c-cpp

  seeded-cpp:
    name: CodeQL seeded defect (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ghcr.io/matthewk84/ics-cpp:main
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: c-cpp
          build-mode: manual
          config-file: .github/codeql/codeql-seeded.yml

      - name: Build the seeded defect (traced by CodeQL)
        run: g++-13 -std=c++20 -c .github/codeql/seeded/format_argument.cpp -o "${RUNNER_TEMP}/format_argument.o"

      - name: Analyze without uploading
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /seeded/language:c-cpp
          output: ${{ runner.temp }}/sarif
          upload: never
          upload-database: false

      - name: Require the seeded defect
        run: python3 .github/scripts/sarif_check.py "${RUNNER_TEMP}/sarif" --expect cpp/wrong-type-format-argument

  seeded:
    name: CodeQL seeded defect (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            expect: py/incomplete-url-substring-sanitization
          - language: javascript-typescript
            expect: js/incomplete-sanitization
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/codeql-seeded.yml

      - name: Analyze without uploading
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /seeded/language:${{ matrix.language }}
          output: ${{ runner.temp }}/sarif
          upload: never
          upload-database: false

      - name: Require the seeded defect
        env:
          EXPECTED_RULE: ${{ matrix.expect }}
        run: python3 .github/scripts/sarif_check.py "${RUNNER_TEMP}/sarif" --expect "${EXPECTED_RULE}"
