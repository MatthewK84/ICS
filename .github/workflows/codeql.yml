name: CodeQL

# Static security and quality analysis of the C++, Python and TypeScript code
# with CodeQL's security-and-quality queries (ICS-008). Findings go to the
# repository's Security tab, and the job fails on any finding. The weekly run
# picks up new queries.
#
# Python and TypeScript are analyzed without a build. C++ is analyzed from a
# traced build inside the gcc13-Release build image (#159), so CodeQL sees the
# real compiler flags and headers (C++20, GoogleTest from Conan); guessing them
# misreads the code. The C++ toolchain workflow builds that image when its
# inputs change, and the C++ analysis waits for it.

on:
  pull_request:
    paths:
      - cpp/**
      - python/**
      - web/**
      - .github/scripts/**
      - .github/codeql/**
      - .github/workflows/codeql.yml
      - .github/actions/build-image/**
      - deploy/toolchain/conan-*.sh
      - deploy/toolchain/image-key.sh
      - deploy/toolchain/find-image.sh
      - deploy/toolchain/Dockerfile.build
  push:
    branches: [main]
    paths:
      - cpp/**
      - python/**
      - web/**
      - .github/scripts/**
      - .github/codeql/**
      - .github/workflows/codeql.yml
      - .github/actions/build-image/**
      - deploy/toolchain/conan-*.sh
      - deploy/toolchain/image-key.sh
      - deploy/toolchain/find-image.sh
      - deploy/toolchain/Dockerfile.build
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/sarif

      - name: Fail on any finding
        run: python3 .github/scripts/sarif_check.py "${RUNNER_TEMP}/sarif"

  # The C++ analysis runs in the build image, as the job's container, so this
  # job finds it first.
  find-image:
    name: CodeQL (c-cpp) build image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Find the gcc13-Release build image
        id: find
        uses: ./.github/actions/build-image
        with:
          config: gcc13-Release
          pull: 'false'
          wait-minutes: '110'

  analyze-cpp:
    name: CodeQL (c-cpp)
    needs: find-image
    runs-on: ubuntu-24.04
    # About 15 minutes: the image holds every dependency.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      security-events: write
    container:
      image: ghcr.io/matthewk84/ics-build:${{ needs.find-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Before CodeQL starts tracing, so the dependencies are not analyzed as
      # ICS code. The image sets CONAN_OFFLINE, so this builds and downloads
      # nothing.
      - name: Install the Conan dependencies
        run: deploy/toolchain/conan-install.sh gcc-release

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: c-cpp
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml

      - name: Build (traced by CodeQL)
        run: |
          cd cpp
          cmake --preset gcc-release
          cmake --build --preset gcc-release

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:c-cpp
          output: ${{ runner.temp }}/sarif
          upload: never

      # paths-ignore does not filter C++ results, so the results in code that is
      # not ICS-authored are dropped before the rest are checked and uploaded:
      # the protobuf code generated into cpp/proto/gen (ICS-011), and the gRPC
      # code generated at build time into the build folder (#146).
      - name: Fail on any finding in ICS code
        run: python3 .github/scripts/sarif_check.py "${RUNNER_TEMP}/sarif" --drop cpp/proto/gen/ cpp/build/

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sarif
          category: /language:c-cpp
