name: SITL rig

# Flies the SITL rig's three scripted engagements every night (ICS-018,
# deploy/sitl/README.md): PX4 and ArduPilot SITL in containers, one flying a
# target and the other an interceptor, their MAVLink mirrored to an emulated
# TAP port and captured there. A run fails if any engagement fails or the
# capture is missing a datagram the rig counted. It also runs on pull requests
# that change the rig.
#
# Each capture is then replayed through the MAVLink adapter (ICS-021,
# cpp/mavlink), built in the ics-cpp image, and the run fails unless every
# position, status text and refused command in the engagement's truth log
# comes out of it (python -m ics_sitl compare). ics-plid (ICS-030) then stores
# each capture, and the run fails unless the records and events it serves back
# are the replay's, each as often (python -m ics_sitl store-check). Then
# ics-time-align (ICS-026,
# cpp/timealign) puts 100 ppm of drift either way on each vehicle's boot clock,
# withholds the middle 60 % of its clock pairs and fits it again; the run fails
# unless every sortie whose clock has no drift of its own aligns within 1 ms.
#
# The autopilot images are compiled only when deploy/sitl/image changes, and
# are otherwise restored from the Actions cache. Each run writes their
# CycloneDX SBOMs. The images are not published: ArduPilot is GPL-3.0, and
# ICS does not distribute it. Each engagement's truth log, summary, TAP
# capture, MAVLink replay, time alignment checks and container logs, and the
# SBOMs, are kept as the sitl-<run id> artifact for 30 days.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/sitl/**
      - deploy/evidence/image-sbom.sh
      - python/ics_sitl/**
      - .github/workflows/sitl.yml
      - .github/actions/toolchain-image/**

permissions:
  contents: read

concurrency:
  group: sitl-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engagements:
    name: Fly the scripted engagements
    runs-on: ubuntu-24.04
    # Compiling both autopilots takes about 15 minutes; building the MAVLink
    # replay about 10 with the Conan cache and 50 without; each engagement
    # about 3.
    timeout-minutes: 100
    env:
      IMAGES: /tmp/sitl-images
      RECORDS: /tmp/sitl-records
      # The ics-cpp image, with the Conan package cache the C++ toolchain
      # workflow saves and the engagement records mounted as they lie.
      RUN: >-
        docker run --rm -v ${{ github.workspace }}:/work/ics -w /work/ics -v /tmp/conan-home:/opt/conan-home
        -v /tmp/sitl-records:/tmp/sitl-records ics-cpp:ci
      REPLAY: cpp/build/gcc-release/testing/mavlink_replay/ics-mavlink-replay
      TIME_ALIGN: cpp/build/gcc-release/testing/time_align/ics-time-align
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Restore the autopilot images
        id: images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.IMAGES }}
          key: sitl-images-${{ hashFiles('deploy/sitl/image/**') }}

      - name: Build the autopilot images
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${IMAGES}"
          for autopilot in px4 ardupilot; do
            docker build -f "deploy/sitl/image/Dockerfile.${autopilot}" -t "ics-sitl-${autopilot}:local" .
          done
          docker save ics-sitl-px4:local ics-sitl-ardupilot:local -o "${IMAGES}/images.tar"

      - name: Save the autopilot images
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.IMAGES }}
          key: ${{ steps.images.outputs.cache-primary-key }}

      - name: Load the autopilot images
        if: steps.images.outputs.cache-hit == 'true'
        run: docker load -i "${IMAGES}/images.tar"

      - name: Install the rig's host tools
        run: |
          mapfile -t packages < <(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' deploy/sitl/apt-packages.txt)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"

      - name: Install Syft
        run: |
          deploy/evidence/install-tools.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # The images hold the base image's Ubuntu packages and the compiled
      # autopilot; the autopilot source pins are in deploy/sitl/image/tools.txt.
      - name: SBOMs of the images
        run: |
          mkdir -p "${RECORDS}"
          for autopilot in px4 ardupilot; do
            deploy/evidence/image-sbom.sh "ics-sitl-${autopilot}:local" "ics-sitl-${autopilot}" \
              "${RECORDS}/ics-sitl-${autopilot}.cdx.json" deb
          done

      # Before any docker run, so the runner user owns it (see cpp-toolchain.yml).
      - name: Create the Conan cache folder
        run: mkdir -p /tmp/conan-home "${RECORDS}"

      - name: Build the ics-cpp image
        uses: ./.github/actions/toolchain-image
        with:
          name: ics-cpp
          dockerfile: deploy/toolchain/Dockerfile.cpp

      # Restored only: the C++ toolchain workflow owns the cache and saves it.
      - name: Restore the Conan package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/conan-home
          key: conan-cpp-toolchain-gcc13-Release-${{ hashFiles('cpp/conan.lock', 'cpp/conan/profiles/*', 'deploy/toolchain/Dockerfile.cpp', 'deploy/toolchain/apt-packages.txt', 'deploy/toolchain/requirements-conan.txt') }}
          restore-keys: conan-cpp-toolchain-gcc13-Release-

      - name: Build the MAVLink replay and time alignment
        run: >-
          ${RUN} bash -c 'deploy/toolchain/conan-install.sh gcc-release
          && cd cpp && cmake --preset gcc-release >/dev/null
          && cmake --build build/gcc-release --target ics-mavlink-replay ics-time-align ics-plid ics-pli-query'

      - name: Fly the engagements
        run: deploy/sitl/run-engagements.sh "${RECORDS}"

      # The range origin is the engagements' (golden/frames, range-origin). The
      # replay runs in the ics-cpp image, which holds the EGM96 grid.
      - name: Replay the captures through the MAVLink adapter
        run: |
          status=0
          for out in "${RECORDS}"/*/; do
            echo "${out}"
            ${RUN} "${REPLAY}" "${out}tap.pcap" 40 -100 700 >"${out}replay.jsonl" || status=1
            PYTHONPATH=python python3 -m ics_sitl compare --truth "${out}truth.jsonl" --replay "${out}replay.jsonl" \
              || status=1
          done
          exit "${status}"

      # ICS-030's "Done when": a SITL feed yields canonical PLI end to end.
      # ics-plid replays each capture into a fresh store (deploy/sitl/
      # plid-check.sh), and the records and events ics-pli-query then gets
      # from it must be the replay's, each as often.
      - name: Store the captures with ics-plid and query them back
        run: |
          status=0
          for out in "${RECORDS}"/*/; do
            echo "${out}"
            ${RUN} deploy/sitl/plid-check.sh "${out}" cpp/build/gcc-release || status=1
            PYTHONPATH=python python3 -m ics_sitl store-check --replay "${out}replay.jsonl" \
              --store "${out}plid-store.jsonl" || status=1
          done
          exit "${status}"

      # ICS-026's "Done when": with 100 ppm of drift either way on each boot
      # clock and the middle 60 % of its clock pairs withheld, every sortie
      # whose clock has no drift of its own aligns within 1 ms. PX4 SIH's
      # boot clock is simulated time, about 2.5 % slow, so its sorties are
      # reported as "drifting" and not checked.
      - name: Check time alignment with an injected drift
        run: |
          status=0
          for out in "${RECORDS}"/*/; do
            echo "${out}"
            ${RUN} "${TIME_ALIGN}" "${out}tap.pcap" 40 -100 700 --inject 100:5000 --withhold 0.2:0.8 \
              >"${out}time-align-fast.jsonl" || status=1
            ${RUN} "${TIME_ALIGN}" "${out}tap.pcap" 40 -100 700 --inject -100:2000 --withhold 0.2:0.8 \
              >"${out}time-align-slow.jsonl" || status=1
            grep -h -e '"kind":"check"' -e '"kind":"verdict"' "${out}"time-align-*.jsonl | cut -c1-200 || true
          done
          exit "${status}"

      - name: Keep the engagement records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitl-${{ github.run_id }}
          path: ${{ env.RECORDS }}/
          if-no-files-found: warn
          retention-days: 30
