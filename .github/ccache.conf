# ccache settings for the C++ toolchain workflow's checks
# (.github/workflows/cpp-toolchain.yml), which build in a new temporary
# folder on each run.
max_size = 400M
# The build folder's path differs from run to run, but
# cpp/cmake/Reproducible.cmake maps it to "build" in everything the compiler
# writes, with -ffile-prefix-map. So neither the working directory nor that
# option's text changes an object, and both are left out of the hash.
hash_dir = false
ignore_options = -ffile-prefix-map=*
