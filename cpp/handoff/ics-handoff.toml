# A sample config for the hand-off scheduler (ICS-039): the [cue] table of
# cpp/cue/ics-cue.toml (ICS-037), and the [handoff] table. ics-mountd
# (ICS-041) will read both from the station's config.

[cue]
range_origin_latitude_deg = 40.0
range_origin_longitude_deg = -100.0
range_origin_height_m = 700.0          # above the WGS 84 ellipsoid
station_latitude_deg = 39.9977477
station_longitude_deg = -100.0
station_height_m = 702.0
target_role = "target"
command_latency_ns = 50_000_000
horizontal_jerk_psd = 4.0
vertical_jerk_psd = 1.0
gate = 16.27
history_ns = 2_000_000_000
coast_limit_ns = 2_000_000_000
capacity = 64
initial_velocity_sigma = 20.0
initial_acceleration_sigma = 10.0
velocity_sigma = 0.2
two_dimensional_horizontal_m = 3.0
two_dimensional_vertical_m = 10.0
three_dimensional_horizontal_m = 1.5
three_dimensional_vertical_m = 3.0
dgnss_horizontal_m = 0.7
dgnss_vertical_m = 1.5
rtk_float_horizontal_m = 0.3
rtk_float_vertical_m = 0.6
rtk_fixed_horizontal_m = 0.03
rtk_fixed_vertical_m = 0.05
other_horizontal_m = 5.0               # anything else, such as an unspecified radar fix
other_vertical_m = 5.0

[handoff]
# The run plan: each engagement's target and the interceptor sent at it, as
# PliRecord.entity_id names them, in the plan's order. The lists must be the
# same length, at most 8.
targets = ["uas-1", "uas-2"]
interceptors = ["int-1", "int-2"]
min_gap_ns = 3_000_000_000             # an engagement nearer than this to the one before it is flagged
dwell_ns = 500_000_000                 # how long the station stays on an engagement after its closest approach
margin_ns = 500_000_000                # how much sooner another engagement must be to take the station
settle_ns = 300_000_000                # the time allowed to acquire a target after a slew
engaged_miss_m = 10.0                  # a closest approach within this is an engagement
launch_speed = 3.0                     # m/s: a slower interceptor has not launched
horizon_ns = 60_000_000_000            # an approach further ahead than this is not predicted
slew_rate = 0.17                       # rad/s, the fastest a slew turns an axis: within the mount's limit
slew_acceleration = 0.5                # rad/s^2, the deceleration a slew is planned on: within the mount's
slew_gain = 6.0                        # a second, the gain that takes over near the target
