# A meson machine file for the sanitizer profiles, asan and tsan (ICS-038).
# Meson links shared libraries with -Wl,--no-undefined by default. Clang links
# a sanitizer's runtime only into executables, so a sanitized shared library
# (GLib's, Aravis's) leaves the runtime's symbols to the executable that loads
# it, and that check would refuse the link.
[built-in options]
b_lundef = false
