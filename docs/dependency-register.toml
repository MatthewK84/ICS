[[project]]
name = "libpcap"
ecosystem = "conan"
packages = ["libpcap"]
used_for = "Captures packets from the station's TAP ports, with NIC hardware time stamps, for ics::capture and ics-capd (cpp/capture, cpp/services/capd, ICS-020); also reads capture files back in the capture bench."
ships = true
license = "BSD-3-Clause"
source = "https://github.com/the-tcpdump-group/libpcap"
governance = "The Tcpdump Group, a volunteer team that reviews changes on GitHub and makes releases. The Conan recipe comes from Conan Center and builds with Conan's bison and flex."
sustainment = "Active and the reference capture library on Linux for decades, with several releases a year. 1.10.6 is the newest on Conan Center. Pinned in cpp/conan.lock. ics::capture keeps it behind its Capture class, so Linux AF_PACKET (TPACKET_V3) used directly could replace it."
foreign_influence = "No controlling organization: The Tcpdump Group is an informal volunteer team with international contributors."
single_maintainer = false
maintainers = "The Tcpdump Group (Guy Harris, Denis Ovsienko, Francois-Xavier Le Bail and others)"
reviewed = 2026-10-03
prepared_by = "Claude Code"
approved_by = "MatthewK84"

[[project]]
name = "OpenSSL"
ecosystem = "conan"
packages = ["openssl"]
used_for = "SHA-256 of each capture file as ics-capd writes it, through the EVP interface (cpp/capture, ICS-020); the run-record manifests (CPP-32) will need the same."
ships = true
license = "Apache-2.0"
source = "https://github.com/openssl/openssl"
governance = "The OpenSSL Foundation and OpenSSL Corporation steer the project; committers review every change on GitHub under a published policy, and the OpenSSL Technical Advisory Committee sets technical direction."
sustainment = "Very active, with a published release policy; 3.5 is the long-term support release, supported until April 2030. OpenSSL's FIPS provider has FIPS 140-3 validations, so a station can compute the hashes in a validated module. Pinned in cpp/conan.lock. ics::capture keeps it behind its Sha256 class, so another validated module could replace it."
foreign_influence = "Stewards: the OpenSSL Foundation (Switzerland) and OpenSSL Corporation (US); international contributors."
single_maintainer = false
maintainers = "The OpenSSL committers, with the OpenSSL Foundation and OpenSSL Corporation"
reviewed = 2026-10-03
prepared_by = "Claude Code"
approved_by = "MatthewK84"

[[project]]
name = "pugixml"
ecosystem = "conan"
packages = ["pugixml"]
used_for = "Reads the Cursor on Target XML events in the UDP datagrams ICS captures, for the CoT adapter (cpp/cot, ICS-022); built without exceptions. CoT arrives from other systems, so the reader is fuzzed end to end."
ships = true
license = "MIT"
source = "https://github.com/zeux/pugixml"
governance = "Maintained by its author, Arseny Kapoulkine (GitHub: zeux), who reviews contributions and makes every release. The Conan recipe comes from Conan Center."
sustainment = "Mature and widely packaged (Debian, Ubuntu, vcpkg, Conan Center), with about one release a year since 2006. Pinned in cpp/conan.lock. It reads no DTD and expands no entities beyond XML's own, so a hostile payload cannot reach files or the network or grow without bound. ics::cot uses it only in event.cpp, so Expat or tinyxml2 could replace it."
foreign_influence = "No controlling organization: its author maintains it, and their jurisdiction was not established from the project's pages."
single_maintainer = true
maintainers = "Arseny Kapoulkine, the author"
reviewed = 2026-10-04
prepared_by = "Claude Code"
approved_by = "MatthewK84"

