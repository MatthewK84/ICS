# ICS dependency register (ICS-010, DoWI 8430.01 §3.5.i).
#
# Every direct dependency of the repository has an entry here, reviewed for
# governance, sustainment, license and foreign influence. CI
# (.github/workflows/dependency-register.yml) fails when a manifest names a
# dependency that is not registered, when an entry is incomplete, or when a
# registered package is no longer used. See docs/dependency-register.md for the
# fields and how to add or remove an entry.
#
# Entries record public information as of their review date. "ships" is true
# when the dependency is included in software ICS delivers; build, test and CI
# tools are false.

[register]
# Our own packages and images, which need no entry.
first_party = ["ghcr.io/matthewk84/", "@ics/"]

