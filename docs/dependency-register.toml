# --- Toolchain data (deploy/toolchain/tools.txt) -----------------------------

[[project]]
name = "EGM96 5-minute geoid grid"
ecosystem = "tool"
packages = ["egm96-5"]
used_for = "The EGM96 geoid that defines MSL heights in ICS; GeoidEval reads it to generate golden/frames/egm96-5.csv (ICS-014), and the C++ frames module will read it (ICS-017)"
ships = true
license = "LicenseRef-Public-Domain"
source = "https://sourceforge.net/projects/geographiclib/files/geoids-distrib/"
governance = "EGM96 is a US Government geoid model; the grid file names NGA's EGM96 page as its source. GeographicLib's author sampled it on a 5-arcminute grid for GeographicLib's Geoid class and distributes it with GeographicLib."
sustainment = "Static data: the grid file is dated 2009-08-29 and will not change. Pinned by sha256 in deploy/toolchain/tools.txt. EGM2008 grids from the same distribution would replace it if ICS moved to EGM2008."
foreign_influence = "US Government data (NGA); the grid is prepared and hosted by GeographicLib's author."
single_maintainer = true
maintainers = "Charles Karney (GeographicLib), distributing NGA's EGM96"
reviewed = 2026-09-30
prepared_by = "Claude Code"
approved_by = "MatthewK84"

# --- SITL autopilots (deploy/sitl/image/tools.txt) ----------------------------

[[project]]
name = "PX4 Autopilot"
ecosystem = "tool"
packages = ["px4-autopilot"]
used_for = "Flight stack compiled into the SITL rig's PX4 image (deploy/sitl, ICS-018): flies a quadrotor with its built-in simulator and emits MAVLink. A test tool; ICS neither links nor publishes it."
ships = false
license = "BSD-3-Clause"
source = "https://github.com/PX4/PX4-Autopilot"
governance = "Hosted by the Dronecode Foundation, a Linux Foundation project; maintainers review changes and a release team makes releases."
sustainment = "Very active, with a release every few months. Pinned to v1.17.0 by commit in deploy/sitl/image/tools.txt. ArduPilot, also in the rig, is the alternative."
foreign_influence = "Dronecode Foundation under the Linux Foundation (US non-profit); international contributors, many from drone companies."
single_maintainer = false
maintainers = "The PX4 maintainers and the Dronecode Foundation"
reviewed = 2026-10-02
prepared_by = "Claude Code"
approved_by = "MatthewK84"

[[project]]
name = "ArduPilot"
ecosystem = "tool"
packages = ["ardupilot"]
used_for = "Flight stack compiled into the SITL rig's ArduPilot image (deploy/sitl, ICS-018): flies ArduCopter in its built-in physics model and emits MAVLink. A test tool: ICS neither links it nor publishes the image, so its GPL places no obligation on ICS code."
ships = false
license = "GPL-3.0-or-later"
source = "https://github.com/ArduPilot/ardupilot"
governance = "The ArduPilot development team, with maintainers for each vehicle and library, reviews changes and makes releases; the project has a non-profit organization."
sustainment = "Very active, with several releases a year. Pinned to Copter-4.7.1 by commit in deploy/sitl/image/tools.txt. PX4, also in the rig, is the alternative."
foreign_influence = "ArduPilot's non-profit organization, whose jurisdiction was not established from the project's pages; international development team."
single_maintainer = false
maintainers = "The ArduPilot development team"
reviewed = 2026-10-02
prepared_by = "Claude Code"
approved_by = "MatthewK84"
