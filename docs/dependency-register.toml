sustainment = "Stable and feature-complete for TOML 1.0; releases are infrequent, and 3.4.0 is the newest on Conan Center. Pinned in cpp/conan.lock. 3.4.0 reaches __builtin_unreachable() on some non-ASCII characters outside strings (found by the ICS-016 fuzz target), so ics::config accepts only ASCII files until a release fixes it. ics::config keeps toml++ behind its own Reader, so toml11 could replace it."
foreign_influence = "No controlling organization: its author maintains it, and their jurisdiction was not established from the project's pages."
