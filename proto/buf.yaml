# The ICS protobuf module (ICS-011): every .proto file under proto/.
# Lint: buf's STANDARD rules plus COMMENTS, so every message, field and enum
# value is documented (with its units, per proto/README.md).
# Breaking: FILE, the strictest set, which also rejects renames and moves that
# would break generated code. proto/check-proto.sh runs both in CI.
version: v2
modules:
  - path: .
    # The seeded lint violation is checked only by check-proto.sh.
    excludes:
      - policy
      - third_party
  # Protobuf files copied unchanged from other projects (third_party/README.md):
  # SAPIENT's BSI Flex 335 v2.0 messages (ICS-024). They keep their authors'
  # style, so only buf's MINIMAL lint rules apply, and they are not formatted.
  - path: third_party
    lint:
      use:
        - MINIMAL
lint:
  use:
    - STANDARD
    - COMMENTS
breaking:
  use:
    - FILE
  # ICS-012 replaced the ics.toolchain_check.v1 sample messages, which nothing
  # used, with the ICS contracts. Remove this once main no longer has them.
  ignore:
    - ics/toolchain_check
