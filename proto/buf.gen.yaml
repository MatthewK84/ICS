# Code generation for the ICS protobuf module (ICS-011). Run from the
# repository root: buf generate proto --template proto/buf.gen.yaml
#
# C++ and Python come from protoc's built-in generators, so protoc 35.0 from
# proto/tools.txt must be on the PATH: its output must match the C++ (Conan
# protobuf/7.35.0) and Python (protobuf 7.35.x) runtimes. TypeScript comes from
# protobuf-es, installed from web/pnpm-lock.yaml. The output is committed, and
# CI fails if it differs from what this file generates.
version: v2
clean: true
plugins:
  - protoc_builtin: cpp
    out: cpp/proto/gen
  - protoc_builtin: python
    out: python/gen
  - protoc_builtin: pyi
    out: python/gen
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/packages/ics-proto/src/gen
    # Enums as "as const" objects, which web/tsconfig.base.json's
    # erasableSyntaxOnly requires.
    opt:
      - target=ts
      - erasable_syntax=true
