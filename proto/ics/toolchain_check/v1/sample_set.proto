// Toolchain check (ICS-011): a second file that imports the first, so the
// generators' cross-file imports are exercised too.
syntax = "proto3";

package ics.toolchain_check.v1;

import "ics/toolchain_check/v1/sample.proto";

// Samples recorded together by one station.
message SampleSet {
  // The recording station's identifier.
  string station_id = 1;
  // The samples, oldest first.
  repeated Sample samples = 2;
}
