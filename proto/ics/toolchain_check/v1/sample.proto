// Toolchain check (ICS-011): exercises the C++, Python and TypeScript
// generators until the ICS messages arrive in package ics.v1 (ICS-012).
syntax = "proto3";

package ics.toolchain_check.v1;

// One measurement from a sensor at a known time.
message Sample {
  // What was measured.
  enum Kind {
    // Not set.
    KIND_UNSPECIFIED = 0;
    // A range, in metres.
    KIND_RANGE = 1;
    // An angle, in radians.
    KIND_ANGLE = 2;
  }

  // Where the sensor was, in the range's east-north-up frame.
  message Position {
    // East of the range origin, in metres.
    double east_m = 1;
    // North of the range origin, in metres.
    double north_m = 2;
    // Up from the range origin, in metres (ellipsoid height difference).
    double up_m = 3;
  }

  // Measurement time, UTC, in nanoseconds since the Unix epoch.
  int64 time_utc_ns = 1;
  // What was measured.
  Kind kind = 2;
  // The measured values, in the unit of the kind.
  repeated double values = 3;
  // Where the sensor was.
  Position position = 4;
  // Extra detail about the measurement, if any.
  oneof detail {
    // A free-text note.
    string note = 5;
    // How many raw readings were averaged.
    uint32 reading_count = 6;
  }
}
